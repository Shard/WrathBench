# PR checks: the half of GitHub issue 7's release contract that needs no cluster
# and no client data. Everything here runs from a bare clone — no `.env`, no
# `data/`, no AzerothCore — with the one submodule the code is made of, the
# wrath-mcp stack: the property CLAUDE.md asks the suite to keep.
#
# Deliberately absent: the C++ module build (needs the worldserver image), the
# tag/digest workflow, chart-as-OCI, and the mutable-image-ref review gate.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bun checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The agent stack is the wrath-mcp submodule, and every check below runs
      # against it at the pinned commit. Only that submodule: deps/azerothcore
      # is a reference checkout for the C++ build, and nothing under test reads
      # it. Not shallow, because the ancestry check needs history; blobless
      # keeps that cheap.
      - name: Check out the stack (wrath-mcp)
        run: |
          git submodule update --init --filter=blob:none wrath-mcp
          git -C wrath-mcp fetch --quiet origin master

      # On master, the pin must be a commit on wrath-mcp's master, so every
      # deployable build is reproducible from the public stack. A PR may pin a
      # wrath-mcp branch commit while both are in review.
      - name: The stack pin is on wrath-mcp's master
        if: github.event_name == 'push'
        run: git -C wrath-mcp merge-base --is-ancestor HEAD origin/master

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Bun version matches the pin
        run: |
          pinned="$(cat .bun-version)"
          actual="$(bun --version)"
          echo "pinned=$pinned actual=$actual"
          test "$pinned" = "$actual"

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      # Fast to slow, so a bad type or a stale doc fails before the 3k-test suite.
      - name: Typecheck
        run: bun run typecheck

      # Nothing here reaches into wrath-mcp/ by path, the shared pins (Bun,
      # zod, typescript, @types/bun) agree with the pinned stack's, and so does
      # the AzerothCore it is tested against (infra/stack-boundary.ts; also a
      # test in the suite below, beside the stack's own inside half). The
      # stack's generated API.md is checked in wrath-mcp's own CI.
      - name: Stack boundary
        run: bun run boundary

      - name: Dashboard build
        run: bun run dashboard:build

      - name: Test suite
        run: bun test

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A dummy immutable tag and a dummy registry: the chart refuses "",
      # "latest" and a missing registry by design (templates/_helpers.tpl), so
      # rendering needs something shaped like a `git describe` output and a
      # registry to put in front of it. Neither is ever a deployment source.
      - name: Lint
        run: helm lint infra/chart/wrathbench --set image.tag=ci-lint --set image.registry=ci

      - name: Render
        run: helm template ci infra/chart/wrathbench --set image.tag=ci-lint --set image.registry=ci >/dev/null

      # The example values file is the documented interface; rendering it keeps
      # it from drifting out of sync with the chart it claims to describe.
      - name: Render the example values
        run: helm template ci infra/chart/wrathbench -f infra/chart/wrathbench/values.example.yaml --set image.tag=ci-lint >/dev/null

      # The NetworkPolicies ship off, so neither render above reaches them.
      # Render them on too, so a template error is not first found by the
      # release that turns them on.
      - name: Render with the NetworkPolicies on
        run: helm template ci infra/chart/wrathbench -f infra/chart/wrathbench/values.example.yaml --set image.tag=ci-lint --set networkPolicy.enabled=true --set 'localModelHosts={192.0.2.20:1234}' >/dev/null

      # An upgrade that changes nothing about MySQL or ClickHouse must leave
      # their pods alone: no per-release label in any pod template, and the
      # database templates identical across two releases.
      - name: Database pods do not roll with the release
        run: infra/chart/stable-pod-templates.sh
