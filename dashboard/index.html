<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WrathBench</title>
    <!--
      One SVG icon rather than a set of rasters: every browser this dashboard is
      read in takes it, and it is the one asset that has to be original — see
      dashboard/public/favicon.svg.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="An agent workbench for World of Warcraft: AI models play WotLK through a TypeScript SDK on a private AzerothCore server."
    />
    <!-- The shell paints its own ground in both schemes; the browser chrome should match it. -->
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WrathBench" />
    <meta property="og:title" content="WrathBench — an agent workbench for World of Warcraft" />
    <meta
      property="og:description"
      content="An agent workbench for World of Warcraft: AI models play WotLK through a TypeScript SDK on a private AzerothCore server."
    />
    <!--
      The origin-dependent card tags — og:url, og:image and the Twitter set —
      are injected here by the Vite hook in vite.config.ts, because og:image
      has to be an absolute URL and only the build knows the origin. A build
      that names none (the private viewer's) leaves this comment alone and
      ships no image tag rather than an unresolvable relative one. The picture
      itself is rendered before the build by infra/render-og.ts.
    -->
    <!-- wrathbench:og -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
