# WrathBench on Kubernetes.
#
# Every value here is consumed by the nusphere cluster repo's HelmRelease; the
# key names are the interface and are not renamed without changing that side in
# the same commit. What the runbook says about each decision is in
# docs/DEPLOY-NUSPHERE.md.

image:
  registry: harbor.local/library
  # REQUIRED. The immutable tag `git describe --tags --always` of the source
  # SHA, produced by infra/build-images.sh. `latest` is refused by the chart:
  # a mutable tag is not a deployment source (GitHub issue 7).
  tag: ""
  pullPolicy: IfNotPresent
  names:
    worldserver: wrathbench-worldserver
    authserver: wrathbench-authserver
    dbImport: wrathbench-db-import
    runner: wrathbench-runner

# One real node. The cluster's other node is a tainted 1-cpu edge box that must
# never run any of this, and the single RWO data PVC is shared by five pods —
# which is only sound because they are all pinned here.
nodeSelector:
  kubernetes.io/hostname: chungusjr

storage:
  className: iscsi-nvme
  data:
    size: 60Gi
  db:
    size: 20Gi

# Existing Secret, created by the cluster repo. Keys are the `.env` names.
# The chart never templates a secret value and never puts one on a command
# line; see docs/OPERATIONS.md ("Secrets").
envSecretName: wrathbench-env

# The model-provider keys the fleet and runner pods carry, by NAME. They are
# read from `envSecretName` and marked optional, so a lane whose key is not in
# the Secret fails its own preflight with a clear message instead of wedging
# the pod. Adding a provider is one line here and one key in the cluster repo.
#
# Enumerated rather than `envFrom` on the whole Secret on purpose — see the
# note in templates/_helpers.tpl; `envFrom` would put WRATHBENCH_ACCOUNT_PASSWORD
# in reach of the snippet sandbox's WRATHBENCH_* forwarding.
modelKeys:
  - CLAUDE_CODE_OAUTH_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN_2
  - OPENROUTER_KEY
  - OPENCODE_KEY
  - CEREBRAS_KEY
  - LMSTUDIO_KEY

# Existing ConfigMap with the single key `fleet.json`, generated by the cluster
# repo's Flux Kustomization from infra/kustomization.yaml in THIS repo. The
# chart deliberately ships no copy of fleet.json: one source of truth.
fleetConfigMapName: wrathbench-fleet-config

# Realm identity. Not secret; the account credentials are.
realm:
  id: 1
  name: WrathBench
  # What the auth handshake advertises to a client. ClusterIP-only: a spectator
  # port-forwards, and their client is told 127.0.0.1 (docs/DEPLOY-NUSPHERE.md).
  address: 127.0.0.1
  port: 8085

db:
  image: mysql:8.4
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # The mysql image's datadir is written as the container user. runAsNonRoot +
  # fsGroup 1000 normally suffices; if the datadir turns out to need the image's
  # own `mysql` user, set this to 999 (documented fallback, see the runbook).
  runAsUser: 1000

worldserver:
  threads: 2
  # PHASE-0 pins kill XP and quest XP equal at 1.0. Everything else is the
  # stock dist value; do not add tuning without updating docs/PHASE-0.md.
  rateXp:
    kill: "1"
    quest: "1"
  # The module's account allowlist. Every surface taking an "account" param
  # serves only these; the module answers 403 account_not_permitted otherwise.
  accounts:
    - RUNNER
    - RUNNER2
    - RUNNER3
    - RUNNER4
    - RUNNER5
    - RUNNER6
    - RUNNER7
    - SHAKEOUT
    - SHAKEOUT2
    - PROBE
    - SMOKE
    - SMOKE2
    - SMOKE3
    - SMOKE4
  # Appender.Server, AzerothCore's `Type,LogLevel,Flags,...` (see
  # worldserver.conf.dist). Type 1 is Console: the compose value was
  # `2,5,16,Server.log,w` — a File appender with per-boot timestamped backups —
  # and that tree reached 22 GB. Console means `kubectl logs`, and the
  # container runtime does the rotation.
  appenderServer: "1,5,0"
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 8Gi
  # World load takes minutes on a cold map cache. The startup probe is what
  # buys that time without a readiness flap; failureThreshold * periodSeconds
  # is the budget.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 90

authserver:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

jobs:
  dbImport:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

fleet:
  enabled: true
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      # It spawns every run-roster and every snippet sandbox as children.
      memory: 6Gi

# The `sleep infinity` dev pod. infra/run-episode.sh --k8s and the preflight
# smokes exec into it; it is the compose `runner` service, unchanged.
runner:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi

viewer:
  enabled: true
  # NOT public mode. WRATHBENCH_VIEWER_PUBLIC is a projection boundary, not a
  # hardening measure, and the viewer is operator-only whatever it is set to
  # (docs/PUBLIC-DASHBOARD.md). The Ingress below is LAN-only.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 3Gi
  ingress:
    enabled: true
    host: wrathbench.local
    className: traefik
    issuer: nusphere-ca
    entrypoint: websecure
    # Passthrough, applied last and therefore able to override anything the
    # chart sets. The cluster repo adds its own tile/annotation conventions
    # here; the chart does not need to know about them.
    annotations: {}
    # hajimari's dashboard discovery, asserted off. The viewer is operator-only
    # and is not a thing to advertise on a tile wall; turning it on is the
    # cluster repo's call, either here or through `annotations` above.
    hajimari:
      enabled: false

publisher:
  enabled: true
  intervalMs: 300000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Extra pod annotations/labels, if the cluster repo wants them.
podAnnotations: {}
podLabels: {}
