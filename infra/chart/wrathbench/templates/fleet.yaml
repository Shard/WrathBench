{{- if .Values.fleet.enabled }}
{{/*
The fleet supervisor (infra/run-fleet.ts) as the Deployment ADR-0020 shaped the
compose service as a rehearsal for. One replica, Recreate, always: two
supervisors on one fleet.json is a night of account_in_use.

Steering is unchanged — edit infra/fleet.json in THIS repo, Flux's Kustomization
regenerates the ConfigMap, the kubelet swaps the projected directory and the
supervisor's next 60-second re-read picks it up. The mount is a DIRECTORY, not
a subPath file: a subPath mount is copied once at start and never updated,
which would turn hot steering into a silent no-op.

Draining is `kubectl scale --replicas=0` plus the wait on fleet-state.json that
infra/k8s-deploy.sh does. terminationGracePeriodSeconds is the compose
stop_grace_period: SIGTERM reaches the supervisor, it SIGTERMs each lane,
run-roster gives its episode 30s of grace, and the supervisor notices the exits
on its next 60s tick. 180s is that floor plus margin; shorter is a SIGKILL
mid-episode.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wrathbench.fullname" . }}-fleet
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        {{- include "wrathbench.labels" . | nindent 8 }}
        app.kubernetes.io/component: fleet
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 180
      containers:
        - name: fleet
          image: {{ include "wrathbench.image.runner" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          workingDir: /wrathbench
          # tini is compose's `init: true`: it reaps the orphaned grandchildren an
          # episode can leave behind, which bun as pid 1 would not.
          command: ["/usr/bin/tini", "--", "bun", "infra/run-fleet.ts", "/wrathbench/config/fleet.json"]
          env:
            # Switches run-roster off the docker-compose-exec path (there is no
            # docker CLI here) and onto direct child processes.
            - name: WRATHBENCH_IN_CONTAINER
              value: "1"
            {{- include "wrathbench.harnessEnv" . | nindent 12 }}
            # For the preflight gate's fixture staging (infra/fixtures/apply.ts
            # writes acore_characters directly). A benchmark episode cannot
            # reach these: sandboxChildEnv drops every WRATHBENCH_DB_* var
            # before spawning the snippet child.
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
          envFrom: {{- include "wrathbench.secretEnvFrom" . | nindent 12 }}
          resources: {{ toYaml .Values.fleet.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /wrathbench/data/runs
              subPath: runs
            - name: data
              mountPath: /wrathbench/data/wiki
              subPath: wiki
            - name: fleet-config
              mountPath: /wrathbench/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
        - name: fleet-config
          configMap:
            name: {{ .Values.fleetConfigMapName }}
        - name: tmp
          emptyDir: {}
{{- end }}
