{{- if .Values.fleet.enabled }}
{{/*
The fleet supervisor (infra/run-fleet.ts) as the Deployment ADR-0020 shaped the
compose service as a rehearsal for. One replica, Recreate, always: two
supervisors on one config is a night of account_in_use.

Steering is the config store on the data PVC (WRATHBENCH_CONFIG_DB in
harnessEnv), the only fleet config: edit it on the viewer's /config page or
with `config-store.ts` through the runner pod, and the supervisor's next
60-second re-read picks it up. Nothing here rolls on a config change, and no
ConfigMap is involved — a fresh cluster seeds the store once from
infra/fleet.example.json (docs/[removed], "The config store").

Draining is `kubectl scale --replicas=0` plus the wait on fleet-state.json that
infra/k8s-deploy.sh does. terminationGracePeriodSeconds is the compose
stop_grace_period: SIGTERM reaches the supervisor, it SIGTERMs each lane,
run-roster gives its episode CHILD_TERM_GRACE_MS (90s) to write its pause
record and release its session, and the supervisor notices the exits on its
next poll. 180s is that floor plus margin; shorter is a SIGKILL mid-pause,
which loses the pause record the next supervisor resumes from. roster.test.ts
pins this file's number against the code's own grace.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wrathbench.fullname" . }}-fleet
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        {{- include "wrathbench.labels" . | nindent 8 }}
        app.kubernetes.io/component: fleet
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 180
      containers:
        - name: fleet
          image: {{ include "wrathbench.image.runner" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          workingDir: /wrathbench
          # tini is compose's `init: true`: it reaps the orphaned grandchildren an
          # episode can leave behind, which bun as pid 1 would not.
          command: ["/usr/bin/tini", "--", "bun", "infra/run-fleet.ts"]
          env:
            # Switches run-roster off the docker-compose-exec path (there is no
            # docker CLI here) and onto direct child processes.
            - name: WRATHBENCH_IN_CONTAINER
              value: "1"
            {{- include "wrathbench.harnessEnv" . | nindent 12 }}
            # For the preflight gate's fixture staging (infra/fixtures/apply.ts
            # writes acore_characters directly). A benchmark episode cannot
            # reach these: sandboxChildEnv drops every WRATHBENCH_DB_* var
            # before spawning the snippet child.
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
            {{- include "wrathbench.harnessSecretEnv" . | nindent 12 }}
            {{- if .Values.codex.enabled }}
            # The `codex` driver's subscription lane, mounted below. The CLI
            # writes its token refresh back into this directory, so it is one
            # live copy on a PVC and never a copy of the operator's ~/.codex.
            - name: CODEX_HOME
              value: /home/bun/.codex
            {{- end }}
          resources: {{ toYaml .Values.fleet.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /wrathbench/data/runs
              subPath: runs
            - name: data
              mountPath: /wrathbench/data/wiki
              subPath: wiki
            # The config store, WRATHBENCH_CONFIG_DB in harnessEnv — the only
            # fleet config. A subPath because the pod does not mount
            # /wrathbench/data itself: a store written there would be pod-local
            # and vanish with the pod. Seeded once, by hand, through the runner
            # pod; an empty store runs an empty board and says so every tick.
            - name: data
              mountPath: /wrathbench/data/config
              subPath: config
            {{- if .Values.codex.enabled }}
            # NOT a subPath: the CLI rewrites auth.json in place and expects a
            # real directory it owns (uid 1000, via the pod's fsGroup).
            - name: codex-home
              mountPath: /home/bun/.codex
            {{- end }}
            # data/logs is deliberately NOT mounted here. The supervisor reads
            # it only as a FALLBACK server identity, for a /health body that
            # carries no build or startedAtMs; the chart guarantees both (the
            # image is stamped WRATHBENCH_BUILD from the same tag), so the
            # fallback is dead code on this deployment — and with Server.log on
            # the console it would be a worse marker than the one it replaces.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
        {{- if .Values.codex.enabled }}
        - name: codex-home
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-codex-home
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
