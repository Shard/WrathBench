{{- if .Values.viewer.enabled }}
{{/*
The operator viewer (runner/viewer/serve.ts).

This is the ONE Ingress in the chart, and it is LAN-only: `ingress.host` is
the canonical name (first rule, the one dashboards link) and `ingress.extraHosts`
are any aliases served by the same router, after it. TLS is the cluster's default
certificate unless `ingress.issuer` names a ClusterIssuer, in which case the
chart renders a per-host Certificate covering every host. The viewer is operator-only
and running it Internet-facing is unsupported: it reads the runs directory,
tails live trajectories, holds an SSE connection per watcher and answers
/api/info about the lab. docs/PUBLIC-DASHBOARD.md is explicit that the public
surface is the static artifact bucket and the SPA in front of it, never a
viewer, module or MCP Service or Ingress — and that WRATHBENCH_VIEWER_PUBLIC is
a projection boundary, not a hardening measure. So: not public mode here, and
no second Ingress anywhere in this chart.

WRATHBENCH_VIEWER_LAN=1 is required, and is an explicit opt-in by design: the
viewer refuses a non-loopback bind without it (docs/DATA-AND-LEGAL.md). Inside
a pod the "LAN" is the pod network, fronted by the Ingress above.

The Ingress hosts are also the viewer's Host allowlist
(WRATHBENCH_VIEWER_ALLOWED_HOSTS, runner/viewer/host-guard.ts, the DNS-rebinding
guard): every name the Ingress routes is a name the viewer answers to, and no
other is, so renaming the viewer is changing `ingress.host` / `extraHosts` and
nothing else. localhost and IP addresses are always answered, which is what
keeps the readiness probe (Host: the pod IP) and a port-forward working.
*/}}
{{- $ing := .Values.viewer.ingress }}
{{- $hosts := prepend ($ing.extraHosts | default list) $ing.host }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wrathbench.fullname" . }}-viewer
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: viewer
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wrathbench.fullname" . }}-viewer
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: viewer
  template:
    metadata:
      labels:
        {{- include "wrathbench.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: viewer
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      {{- include "wrathbench.imagePullSecrets" . | nindent 6 }}
      # Only the fleet pod holds an API token (templates/run-pods.yaml).
      automountServiceAccountToken: false
      containers:
        - name: viewer
          image: {{ include "wrathbench.image.runner" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          workingDir: /wrathbench
          command: ["bun", "runner/viewer/serve.ts"]
          env:
            {{- include "wrathbench.harnessEnv" . | nindent 12 }}
            # The derived store. Every listing route reads it rather than
            # opening a thousand run directories over iSCSI; the live-progress
            # polling still reads run.sqlite directly.
            {{- include "wrathbench.clickhouseEnv" . | nindent 12 }}
            - name: WRATHBENCH_VIEWER_LAN
              value: "1"
            - name: WRATHBENCH_VIEWER_PORT
              value: "8090"
            {{- if $ing.enabled }}
            # The names a browser may address the viewer by: the Ingress hosts.
            # Any other Host is a 421 (runner/viewer/host-guard.ts).
            - name: WRATHBENCH_VIEWER_ALLOWED_HOSTS
              value: {{ join "," $hosts | quote }}
            {{- end }}
            - name: WRATHBENCH_MINIMAP_DIR
              value: /wrathbench/data/minimap
            # The SPA is built into the runner image (dashboard/dist is
            # gitignored, so it exists nowhere else).
            - name: WRATHBENCH_DASHBOARD_DIR
              value: /wrathbench/dashboard/dist
            # The module secret only, so /api/info can name the worldserver
            # build off /health. Deliberately NOT envFrom the whole Secret: the
            # viewer has no business holding a model key or an S3 credential.
            - name: WRATHBENCH_MODULE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: WRATHBENCH_MODULE_SECRET
          ports:
            - name: http
              containerPort: 8090
          # The kubelet sends Host: <pod IP>:8090, which the Host allowlist
          # always answers (an IP, not a name a rebinding page could use).
          readinessProbe:
            httpGet:
              path: /api/info
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.viewer.resources | nindent 12 }}
          volumeMounts:
            # The viewer is written to read only: "Everything here reads. The
            # runs directory is never written to, and each run.sqlite is
            # opened readonly so a live writer is untouched." The mount is
            # writable anyway, because a live run's run.sqlite is in WAL
            # (runner/src/rundb.ts) and a readonly handle on a WAL-mode file
            # creates and maps its -wal and -shm beside it.
            # Run listings come from the derived store; what is still read
            # here is the live-progress path — the account ledger, the live
            # map, and a run page's own trajectory tail.
            - name: data
              mountPath: /wrathbench/data/runs
              subPath: runs
            - name: data
              mountPath: /wrathbench/data/minimap
              subPath: minimap
              readOnly: true
            # The config store (WRATHBENCH_CONFIG_DB in harnessEnv), the only
            # fleet config: the one WRITABLE data mount on the viewer, and it
            # has to be. It is the operator's edit surface (/api/config and the
            # /config page, operator-only and not mounted in public mode), and
            # even the reads need it: a readonly sqlite handle still creates
            # the -wal/-shm sidecars beside the file, so a readOnly mount would
            # make every config read a 500.
            - name: data
              mountPath: /wrathbench/data/config
              subPath: config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
{{- if $ing.enabled }}
{{- if $ing.issuer }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wrathbench.fullname" . }}-viewer
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
spec:
  secretName: {{ include "wrathbench.fullname" . }}-viewer-tls
  dnsNames:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $ing.issuer }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wrathbench.fullname" . }}-viewer
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
  annotations:
    # Traefik-only: the entrypoint annotation means nothing to another
    # controller, so it is rendered only when Traefik is the class.
    {{- if eq $ing.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ $ing.entrypoint }}
    {{- end }}
    # Dashboard discovery is OFF unless someone asks for it: the viewer is
    # operator-only and is not a thing to advertise on a tile wall. The chart
    # knows one such annotation by name because "off" has to be asserted, not
    # merely omitted; anything else the deploying cluster wants goes through
    # `annotations` below, which is applied last and wins.
    hajimari.io/enable: {{ $ing.hajimari.enabled | quote }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  {{- if $ing.issuer }}
  # Only rendered when the chart issues the certificate itself. Without an
  # issuer there is deliberately no spec.tls: the ingress controller's default
  # certificate (the cluster's default certificate) serves every host.
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ include "wrathbench.fullname" . }}-viewer-tls
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wrathbench.fullname" $ }}-viewer
                port:
                  number: 8090
    {{- end }}
{{- end }}
{{- end }}
