{{/*
Three volumes, all RWO on storage.className (iscsi-nvme: Retain, expandable,
honest fsync — operator decision 2026-09-05).

`data` is the whole of `data/` in today's layout: client/ (the AzerothCore
server data directory, read-only and never in git), runs/ (every trajectory,
fleet-state.json, the pause switch, the lane logs), wiki/, minimap/, etc/,
logs/, publish/, collector/ and config/ (the live config store, a subPath the
kubelet creates on first mount: root-owned, setgid group 1000 and
group-writable, which is what lets uid 1000 write it without a seed step).
Every pod mounts it as subPaths, at once, which RWO permits only because
every one of them is nodeSelector'd to the same node.

`db` is the MySQL datadir and nothing else.

`codex-home` is the `codex` driver's subscription lane: a logged-in Codex home
directory that the CLI writes its token refresh back into. It is a volume
rather than a Secret key because it is a directory with mutable state, and it
is mounted rather than copied because a second live copy invalidates the first.

Retain means deleting the release does not delete a run. That is the point.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wrathbench.fullname" . }}-data
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wrathbench.fullname" . }}-db
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.db.size }}
{{- if .Values.codex.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wrathbench.fullname" . }}-codex-home
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: codex-home
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.codexHome.size }}
{{- end }}
