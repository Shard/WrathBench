{{- if include "wrathbench.on.game" $ }}
{{/*
The two one-shots compose runs as `depends_on` gates, as Helm hooks.

Both are idempotent against an existing database and are therefore safe on
every upgrade, not just the install:

  db-import  AzerothCore's `dbimport`. Creates acore_auth / acore_characters /
             acore_world if missing, imports the base dumps, and applies the
             updates that have not been applied. That is what the tool is for.

  bootstrap  infra/bootstrap/bootstrap.ts. Every write is an upsert: the
             realmlist row is `INSERT ... ON DUPLICATE KEY UPDATE` keyed on id,
             and the account is only rewritten when the stored SRP6 verifier
             does not match the configured password. Its own header says "safe
             to re-run"; no guard is needed and none is added, because a guard
             around it would also skip the converge it exists to do.

Weights order them: db-import (0) then bootstrap (10). before-hook-creation
deletion is what keeps the second upgrade from colliding with the first Job.

A viewer release (`image.viewerTag` alone, infra/k8s-release-viewer.sh) is a
Helm upgrade too, so both run on it, with the fleet and the realm live. Helm
runs post-upgrade hooks on every upgrade, changed or not, and skipping them
would leave a values pin made while the viewer is ahead (a bigger pool, say)
unconverged. They are kept on `image.tag`, never
the viewer group's tag, so they run the fleet's code, which already converged
this database, against the values it converged on. That makes each step a
no-op: dbimport finds no update it has not applied, the realmlist upsert
writes the values the row already holds and never touches the columns the
worldserver keeps (flag, population), the prune finds no row it has not
already removed and keeps every world's (`isWorldRealm`), the runner
account's verifier matches so it is not rewritten, pool and tenant accounts
are created only when missing, and the tenant `account_access` delete finds
none. What a viewer pin does add: the HelmRelease is Ready only after both
finish (wait-for-db, then dbimport's scan), and a hook that fails fails the
upgrade, as in any release. If the deployment's Secret or these values
drifted since the last upgrade, the next upgrade of either kind converges
them; that is not new, but on a viewer pin it lands with runs live.
`infra/viewer-tag-chart.test.ts` holds both Jobs byte-identical when only the
viewer group's tag moves.
*/}}
{{- $ctx := . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wrathbench.fullname" . }}-db-import
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-import
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "wrathbench.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-import
    spec:
      restartPolicy: Never
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      {{- include "wrathbench.imagePullSecrets" . | nindent 6 }}
      initContainers:
        # The hooks run as soon as Helm creates them; the db Deployment may
        # still be starting. `dbimport` fails fast on a refused connection, so
        # wait here rather than lean on backoffLimit.
        - name: wait-for-db
          image: {{ include "wrathbench.image.dbImport" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - 'for i in $(seq 1 120); do mysqladmin ping -h "$WRATHBENCH_DB_HOST" -u root --silent && exit 0; sleep 5; done; echo "db never answered"; exit 1'
          env:
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
            {{- include "wrathbench.mysqlPwdEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi, ephemeral-storage: 256Mi }
            limits: { memory: 256Mi }
      containers:
        - name: db-import
          image: {{ include "wrathbench.image.dbImport" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "wrathbench.acDbEnv" . | nindent 12 }}
            - name: AC_DATA_DIR
              value: /azerothcore/env/dist/data
            - name: AC_LOGS_DIR
              value: /azerothcore/env/dist/logs
          resources: {{ toYaml .Values.jobs.dbImport.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/etc
              subPath: etc
            - name: logs
              mountPath: /azerothcore/env/dist/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.jobs.dbImport.logsSizeLimit }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wrathbench.fullname" . }}-bootstrap
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "wrathbench.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      {{- include "wrathbench.imagePullSecrets" . | nindent 6 }}
      initContainers:
        # The hooks run as soon as Helm creates them; the db Deployment may
        # still be starting. `dbimport` fails fast on a refused connection, so
        # wait here rather than lean on backoffLimit.
        - name: wait-for-db
          image: {{ include "wrathbench.image.dbImport" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - 'for i in $(seq 1 120); do mysqladmin ping -h "$WRATHBENCH_DB_HOST" -u root --silent && exit 0; sleep 5; done; echo "db never answered"; exit 1'
          env:
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
            {{- include "wrathbench.mysqlPwdEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi, ephemeral-storage: 256Mi }
            limits: { memory: 256Mi }
      containers:
        - name: bootstrap
          image: {{ include "wrathbench.image.runner" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          workingDir: /wrathbench
          command: ["bun", "run", "infra/bootstrap/bootstrap.ts"]
          env:
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
            - name: WRATHBENCH_AUTH_DB
              value: acore_auth
            - name: WRATHBENCH_REALM_ID
              value: {{ .Values.realm.id | quote }}
            - name: WRATHBENCH_REALM_NAME
              value: {{ .Values.realm.name | quote }}
            # The realm address the auth handshake advertises. The module is
            # in-process and never reads this row, so it stays at loopback: a
            # spectator port-forwards 3724 and 8085 and their client connects to
            # 127.0.0.1. Never a routable address.
            - name: WRATHBENCH_REALM_ADDRESS
              value: {{ .Values.realm.address | quote }}
            - name: WRATHBENCH_REALM_PORT
              value: {{ .Values.realm.port | quote }}
            # Uppercased by bootstrap.ts; AzerothCore uppercases both before
            # deriving the SRP6 verifier.
            - name: WRATHBENCH_ACCOUNT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: WRATHBENCH_ACCOUNT_USER
            - name: WRATHBENCH_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: WRATHBENCH_ACCOUNT_PASSWORD
            # The generated pool, POOL01 … POOLnn: each missing one is created
            # with its name as its password, the harness accounts' convention;
            # the allowlist carries the same names from the same value.
            - name: WRATHBENCH_POOL_SIZE
              value: {{ include "wrathbench.poolSize" . | quote }}
            {{- if include "wrathbench.on.worlds" . }}
            # The eval pool, EVAL01 … EVALnn, created the same way and put on
            # no allowlist of the long-lived world's: a world's allowlist is
            # its attempt's accounts, so the pool grows with no restart.
            - name: WRATHBENCH_EVAL_POOL_SIZE
              value: {{ include "wrathbench.evalPoolSize" . | quote }}
            {{- end }}
            {{- if include "wrathbench.on.hosted" . }}
            # Hosted mode's tenant pool, TENANT01 … TENANTnn: each missing one
            # is created with a random password nobody is shown, and none has
            # account access. The freeplay world's allowlist carries the same
            # names from the same value; no config-reading pod is told it.
            - name: WRATHBENCH_TENANT_POOL_SIZE
              value: {{ include "wrathbench.tenantPoolSize" . | quote }}
            {{- end }}
          resources: {{ toYaml .Values.jobs.bootstrap.resources | nindent 12 }}
{{- end }}
