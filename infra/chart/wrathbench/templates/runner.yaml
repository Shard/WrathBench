{{- if .Values.runner.enabled }}
{{/*
The `sleep infinity` dev pod — compose's `runner` service, unchanged in
purpose. It is the exec target for infra/run-episode.sh --k8s, for the deploy
script's preflight smokes, and for anything an operator wants to run against
the live realm by hand. Same image, mounts and env as the fleet.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wrathbench.fullname" . }}-runner
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "wrathbench.labels" . | nindent 8 }}
        app.kubernetes.io/component: runner
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner
          image: {{ include "wrathbench.image.runner" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "wrathbench.containerSecurityContext" . | nindent 12 }}
          workingDir: /wrathbench
          command: ["sleep", "infinity"]
          env:
            - name: WRATHBENCH_IN_CONTAINER
              value: "1"
            {{- include "wrathbench.harnessEnv" . | nindent 12 }}
            {{- include "wrathbench.dbEnv" . | nindent 12 }}
            {{- include "wrathbench.harnessSecretEnv" . | nindent 12 }}
            {{- if .Values.codex.enabled }}
            # The `codex` driver's subscription lane, mounted below. The CLI
            # writes its token refresh back into this directory, so it is one
            # live copy on a PVC and never a copy of the operator's ~/.codex.
            - name: CODEX_HOME
              value: /home/bun/.codex
            {{- end }}
          resources: {{ toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /wrathbench/data/runs
              subPath: runs
            - name: data
              mountPath: /wrathbench/data/wiki
              subPath: wiki
            # The config store, same as the fleet's: this pod is where
            # `config-store.ts seed|export|get|patch` is exec'd, by the operator
            # and by infra/k8s-deploy.sh (docs/RUNBOOK.md "Where the config
            # lives"), so it has to see the fleet's store and not a pod-local one.
            - name: data
              mountPath: /wrathbench/data/config
              subPath: config
            {{- if .Values.codex.enabled }}
            # NOT a subPath: the CLI rewrites auth.json in place and expects a
            # real directory it owns (uid 1000, via the pod's fsGroup).
            - name: codex-home
              mountPath: /home/bun/.codex
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
        {{- if .Values.codex.enabled }}
        - name: codex-home
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-codex-home
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.runner.tmpSizeLimit }}
{{- end }}
