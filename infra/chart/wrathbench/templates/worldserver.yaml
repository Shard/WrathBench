{{/*
The realm, with mod-wrathbench compiled in.

ClusterIP ONLY, and the Service is named `worldserver` with no prefix — see the
note in _helpers.tpl. No NodePort, no LoadBalancer, no Ingress, ever: the module
port (8086) and the world port (8085) are reachable from inside the namespace
and from an operator's `kubectl port-forward`, and nothing else (operator
decision 2026-09-05; docs/PUBLIC-DASHBOARD.md).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: worldserver
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worldserver
  ports:
    - name: world
      port: 8085
      targetPort: 8085
    - name: module
      port: 8086
      targetPort: 8086
    {{- if .Values.staging.enabled }}
    # The SOAP console, for the party stager only (values.yaml `staging`).
    # The worldserver's NetworkPolicy (templates/networkpolicy.yaml) admits
    # this port from the fleet and runner pods and nothing else.
    - name: soap
      port: {{ .Values.staging.soapPort }}
      targetPort: {{ .Values.staging.soapPort }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wrathbench.fullname" . }}-worldserver
  labels:
    {{- include "wrathbench.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worldserver
  template:
    metadata:
      labels:
        {{- include "wrathbench.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: worldserver
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {{- include "wrathbench.podSecurityContext" . | nindent 8 }}
      {{- include "wrathbench.imagePullSecrets" . | nindent 6 }}
      # The world takes minutes to load and holds live sessions; give it room
      # to write its final state.
      terminationGracePeriodSeconds: 120
      # The world load reads the database for minutes and carries on past a
      # query that lost its connection, with whatever table it was reading left
      # empty. So the load does not start until MySQL answers a real query
      # (`mysqladmin ping` passes a server that refuses the login). Server-level
      # on purpose: acore_world is the db-import hook's to create, and this
      # pod must not wait on a hook. A db recreated mid-load is caught by the
      # startup probe below. Same loop as the hooks' wait-for-db, in the
      # worldserver's own image, which has the client.
      initContainers:
        {{- include "wrathbench.worldserver.waitForDb" . | nindent 8 }}
      containers:
        {{- include "wrathbench.worldserver.container" (dict "ctx" . "world" false) | nindent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wrathbench.fullname" . }}-data
        - name: temp
          emptyDir:
            sizeLimit: {{ .Values.worldserver.tempSizeLimit }}
