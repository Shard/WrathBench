# WrathBench stack.
#
# Bring up with:  docker compose -f infra/compose.yml up -d
# See infra/README.md for the fresh-machine checklist (the data/ directories
# must exist and be owned by the invoking user before the first `up`).
#
# Posture (docs/DATA-AND-LEGAL.md): no port is published to the host. The realm
# is reachable only from inside the `wrathbench` network. If you must expose
# something for debugging, bind it to 127.0.0.1 explicitly and never commit it.
#
# Config: AzerothCore reads `AC_*` environment variables in preference to the
# values in worldserver.conf / authserver.conf (Config.cpp GetValueDefault
# checks the env var first and only falls back to the parsed file). So the
# generated .conf files under data/etc are the stock dist files and every
# setting we care about is pinned here instead.

name: wrathbench

x-db-info: &db-info
  AC_LOGIN_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_auth"
  AC_WORLD_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_world"
  AC_CHARACTER_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_characters"

# The four values every WrathBench-side tool needs to reach the database
# directly (bootstrap, fixtures, and the smokes that stage a fixture through
# infra/fixtures/apply.ts). One definition, referenced by every service that
# needs it, so the password lives in exactly one place.
x-wb-db: &wb-db
  WRATHBENCH_DB_HOST: db
  WRATHBENCH_DB_PORT: "3306"
  WRATHBENCH_DB_USER: root
  WRATHBENCH_DB_PASSWORD: ${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench}

# The `codex` driver's subscription LANE (runner/README.md, Drivers): a
# logged-in Codex home — a DIRECTORY holding auth.json and the persisted
# threads, never a token. It is mounted, never copied: the CLI refreshes the
# ChatGPT token in place and a second copy invalidates the first ("refresh
# token was already used", seen on this host 2026-09-05).
#
# The host side is the operator's own `codex login` home, and it is the same
# directory the host `--local` path uses. `docker compose -f infra/compose.yml`
# takes infra/ as the project directory, so it reads infra/.env (absent) and
# NOT the repository .env — the default below is what applies unless the
# invoking shell exports CODEX_HOME.
#
# The container side is a fixed path, and the services set CODEX_HOME to it:
# the repository .env carries the HOST path (so `--local` works) and Bun's
# autoload does not overwrite a variable the environment already set, so the
# compose value wins inside the container. uid 1000 on both sides, so the
# refresh writes through.
x-codex-lane: &codex-lane "${CODEX_HOME:-/home/mark/.codex}:/home/bun/.codex"

x-ac-build: &ac-build
  context: ..
  dockerfile: infra/docker/server.Dockerfile
  args:
    USER_ID: ${WRATHBENCH_UID:-1000}
    GROUP_ID: ${WRATHBENCH_GID:-1000}
    DOCKER_USER: acore
    # /health `build` stamp. Set by infra/build-worldserver.sh; a bare
    # `docker compose build` without it produces an image that says "unknown".
    WRATHBENCH_BUILD: ${WRATHBENCH_BUILD:-}

services:
  # ---------------------------------------------------------------- database
  db:
    image: mysql:8.4
    # Version follows AzerothCore's own docker-compose.yml at the pinned commit.
    environment:
      MYSQL_ROOT_PASSWORD: ${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench}
    volumes:
      - db-data:/var/lib/mysql
    networks: [wrathbench]
    restart: unless-stopped
    healthcheck:
      # Verbatim from AzerothCore's compose; the $$ is compose escaping for $.
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  # ------------------------------------------------------------- db bootstrap
  # One shot. Creates acore_auth / acore_characters / acore_world if missing,
  # imports the base dumps, and applies pending updates. Exits 0 when done.
  db-import:
    image: wrathbench/db-import
    build:
      <<: *ac-build
      target: db-import
    environment:
      <<: *db-info
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
    networks: [wrathbench]
    depends_on:
      db:
        condition: service_healthy

  # Realm row + runner account. See infra/bootstrap/bootstrap.ts for why this
  # writes SQL directly rather than driving the worldserver console or SOAP.
  bootstrap:
    image: oven/bun:1.4.0
    working_dir: /wrathbench
    command: ["bun", "run", "infra/bootstrap/bootstrap.ts"]
    environment:
      <<: *wb-db
      WRATHBENCH_AUTH_DB: acore_auth
      WRATHBENCH_REALM_ID: ${WRATHBENCH_REALM_ID:-1}
      WRATHBENCH_REALM_NAME: ${WRATHBENCH_REALM_NAME:-WrathBench}
      # The realm address the auth handshake advertises. The module is
      # in-process and never reads this row, so it stays at host loopback.
      # Never a public address.
      WRATHBENCH_REALM_ADDRESS: 127.0.0.1
      WRATHBENCH_REALM_PORT: "8085"
      # Uppercase: AzerothCore uppercases both before deriving the verifier.
      WRATHBENCH_ACCOUNT_USER: ${WRATHBENCH_ACCOUNT_USER:-RUNNER}
      WRATHBENCH_ACCOUNT_PASSWORD: ${WRATHBENCH_ACCOUNT_PASSWORD:-RUNNER}
    volumes:
      - ..:/wrathbench
    networks: [wrathbench]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully

  # ------------------------------------------------------------ fixtures
  # One-off operator tool. Puts a logged-out smoke character into a named
  # scenario by writing acore_characters rows directly, so a smoke can prove a
  # late-game claim in seconds instead of playing minutes to reach it. Smoke and
  # PROBE accounts only, never reachable from runner/ or sdk/. See
  # infra/fixtures/apply.ts and the "Scenario fixtures" section of infra/README.
  #
  # `entrypoint`, not `command`: `docker compose run fixtures --account ...`
  # replaces the service's *command*, so the flags have to land after the
  # entrypoint or they would clobber `bun run apply.ts` itself.
  #
  # The profile keeps it out of `up`, and depends_on names only the database:
  # this runs against a live stack, and `--no-deps` on top keeps compose from
  # deciding db-import needs a rerun.
  fixtures:
    image: oven/bun:1.4.0
    profiles: [tools]
    working_dir: /wrathbench
    entrypoint: ["bun", "run", "infra/fixtures/apply.ts"]
    environment:
      <<: *wb-db
      WRATHBENCH_CHARACTERS_DB: acore_characters
    volumes:
      - ..:/wrathbench
    networks: [wrathbench]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------------ servers
  authserver:
    image: wrathbench/authserver
    build:
      <<: *ac-build
      target: authserver
    environment:
      AC_LOGIN_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_auth"
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_BIND_IP: "0.0.0.0"
      AC_REALM_SERVER_PORT: "3724"
    # Loopback only, for operator inspection.
    # Per docs/DATA-AND-LEGAL.md this must never bind beyond 127.0.0.1.
    ports:
      - "127.0.0.1:3724:3724"
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
    networks: [wrathbench]
    tty: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      # Started, not healthy: authserver resolves the realm address (the
      # `worldserver` service name) at boot and exits if DNS fails, so the
      # worldserver container must exist first. restart:unless-stopped covers
      # the remaining race while worldserver is still coming up.
      worldserver:
        condition: service_started

  worldserver:
    image: wrathbench/worldserver
    build:
      <<: *ac-build
      target: worldserver
    environment:
      <<: *db-info
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_BIND_IP: "0.0.0.0"
      AC_WORLD_SERVER_PORT: "8085"
      AC_REALM_ID: ${WRATHBENCH_REALM_ID:-1}
      # PHASE-0 pins kill XP and quest XP equal at 1.0. Everything else is the
      # stock dist value; do not add tuning here without updating docs/PHASE-0.md.
      AC_RATE_XP_KILL: "1"
      AC_RATE_XP_QUEST: "1"
      # SOAP stays off. The harness has no privileged control path into the
      # world by design (docs/CONTRACTS.md); actions go through the module.
      AC_SOAP_ENABLED: "0"
      # mod-wrathbench control module (module/). Pinned here rather than in the
      # module .conf: the stock docker entrypoint only materialises the main
      # component .conf from its .dist, never module confs, so a fresh boot would
      # otherwise leave the module disabled. AC_* env wins over the file either
      # way (see the config note at the top of this compose). The port is not
      # published to the host; the runner reaches it at worldserver:8086.
      AC_WRATH_BENCH_ENABLE: "1"
      AC_WRATH_BENCH_BIND_ADDRESS: "0.0.0.0"
      AC_WRATH_BENCH_PORT: "8086"
      AC_WRATH_BENCH_AUDIT_DIR: "/azerothcore/env/dist/logs/wrathbench"
      # Server.log with per-boot timestamped backups (appender flag 16), so
      # ERROR/WARN history survives restarts and container recreation on the
      # data/logs volume. Default mode "w" truncated every boot.
      AC_APPENDER_SERVER: "2,5,16,Server.log,w"
      # The port secret (module/PROTOCOL.md "Authentication"; FOLLOW-UPS 19).
      # Every route needs it. It lives in the repo-root .env as
      # WRATHBENCH_MODULE_SECRET; compose does not read that file (its project
      # directory is infra/), so infra/deploy-worldserver.sh exports it before
      # recreating this container, and a bare `compose up` without it in the
      # shell leaves the module refusing to listen (fail closed, logged). The
      # runner and fleet services read the same .env through Bun's autoload.
      AC_WRATH_BENCH_SECRET: "${WRATHBENCH_MODULE_SECRET:-}"
      AC_WRATH_BENCH_ACCOUNT: "${WRATHBENCH_ACCOUNT_USER:-RUNNER}"
      # Account allowlist: every surface taking an "account" param serves only
      # these (module refuses others with 403 account_not_permitted).
      # SHAKEOUT2 is the second subscription-lane account (parallel opus+sonnet;
      # one live session per account). It exists in auth already; this line only
      # takes effect when the worldserver container is next recreated, and until
      # then the module answers 403 account_not_permitted for it.
      # SMOKE..SMOKE4 are the fleet's preflight-gate accounts (infra/fleet.json
      # preflight): the gate's smokes log in as them, one account per parallel
      # chain, so they never contend with a lane or with PROBE (the ad-hoc
      # debugging account). Same caveat as SHAKEOUT2 — effective at the next
      # recreate, i.e. the next deploy window (SMOKE2-4 added 2026-08-23; until
      # that recreate the running module permits SMOKE alone) — and each must
      # exist in auth first: `docker compose -f infra/compose.yml run --rm
      # --no-deps -e WRATHBENCH_ACCOUNT_USER=SMOKE2
      # -e WRATHBENCH_ACCOUNT_PASSWORD=SMOKE2 bootstrap` (done for all four).
      # RUNNER7 is the second PAID account (fleet.json accounts.paid; paid class
      # split out 2026-08-23). The recreate it was waiting on landed 2026-09-01,
      # so the running worldserver does carry it; bootstrapped in auth and added
      # to accounts.paid on 2026-09-04, when policy.paid.maxConcurrent went to 2
      # and the account — checked before the cap — was the real constraint.
      AC_WRATH_BENCH_ACCOUNTS: "${WRATHBENCH_ACCOUNT_USER:-RUNNER},RUNNER2,RUNNER3,RUNNER4,RUNNER5,RUNNER6,RUNNER7,SHAKEOUT,SHAKEOUT2,PROBE,SMOKE,SMOKE2,SMOKE3,SMOKE4"
      AC_WRATH_BENCH_THREADS: "2"
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
      # AzerothCore server data directory: dbc/ maps/ vmaps/ mmaps/.
      # Supplied by the operator. Read-only, never in git.
      - ../data/client:/azerothcore/env/dist/data:ro
    # Loopback only, for operator inspection.
    # Per docs/DATA-AND-LEGAL.md this must never bind beyond 127.0.0.1.
    # Takes effect when the container is next recreated (deploy window).
    ports:
      - "127.0.0.1:8085:8085"
    networks: [wrathbench]
    stdin_open: true
    tty: true
    restart: unless-stopped
    # No healthcheck: the runtime image has no curl/nc and the module's HTTP
    # port is not defined yet. TODO once module/ lands: probe the module.
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully

  # ------------------------------------------------------------------- runner
  # The agent loop (runner/). Bun plus the Claude Code CLI for the
  # claude-subscription shakeout driver (runner/README.md Drivers).
  runner:
    image: wrathbench/runner
    build:
      context: ..
      dockerfile: infra/docker/runner.Dockerfile
    working_dir: /wrathbench
    command: ["sleep", "infinity"]
    # The smokes under infra/smoke/ are run by `docker compose exec runner bun
    # infra/smoke/<name>.ts`, and the ones that stage a fixture shell out to
    # infra/fixtures/apply.ts, which writes acore_characters directly. Carrying
    # the four vars here is what makes that invocation need no `-e` flags. An
    # episode exec'd into this container cannot pass them on: sandboxChildEnv
    # (runner/src/sandbox/host.ts) drops WRATHBENCH_DB_* from the snippet
    # child's env, the same protection the `fleet` service relies on.
    environment:
      <<: *wb-db
      # The codex lane inside the container (see x-codex-lane above).
      CODEX_HOME: /home/bun/.codex
    volumes:
      - ..:/wrathbench
      # The repo mount above already carries data/wiki and data/runs. These are
      # named explicitly so the contract survives the repo mount going away.
      - ../data/wiki:/wrathbench/data/wiki
      - ../data/runs:/wrathbench/data/runs
      - *codex-lane
    networks: [wrathbench]
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_started

  # ------------------------------------------------------------------- fleet
  # The fleet supervisor (infra/run-fleet.ts) as a long-lived service: up while
  # the dev machine is up, steered by editing infra/fleet.json, no deadline.
  # See docs/OPERATIONS.md.
  #
  # Same image and mounts as `runner` by design: the supervisor's children are
  # run-roster processes whose children are `bun runner/src/run.ts` episodes, so
  # everything the runner needs must be here. WRATHBENCH_IN_CONTAINER switches
  # run-roster off the docker-compose-exec path (there is no docker CLI in this
  # image) and onto direct child processes.
  #
  # `profiles` keeps a bare `docker compose up -d` from starting a SECOND
  # supervisor against the same fleet.json (two lanes on one account is a night
  # of account_in_use). Naming the service activates the profile, so
  #   docker compose -f infra/compose.yml up -d --no-deps fleet
  # still works — and --no-deps is not optional: without it compose may decide a
  # dependency is out of date and recreate the worldserver under live episodes.
  fleet:
    image: wrathbench/runner
    build:
      context: ..
      dockerfile: infra/docker/runner.Dockerfile
    profiles: [fleet]
    working_dir: /wrathbench
    command: ["bun", "infra/run-fleet.ts", "infra/fleet.json"]
    environment:
      WRATHBENCH_IN_CONTAINER: "1"
      # For the preflight gate's fixture staging: kill-credit.ts starts from the
      # `vineyard-kill-credit` scenario, and `infra/fixtures/apply.ts` writes the
      # characters DB directly. The supervisor itself never touches the DB.
      # A benchmark episode cannot reach these: the snippet sandbox drops every
      # WRATHBENCH_DB_* var before spawning the child (runner/src/sandbox/host.ts
      # sandboxChildEnv), which is what keeps a model off the database on this
      # service and on `runner` alike.
      <<: *wb-db
      # git lives in the image and the repo mount carries .git, so every episode
      # is stamped with a real `git describe` (dirty trees included) rather than
      # a version frozen at `up` time. The repo is uid 1000 and so is `bun`, but
      # be explicit so a uid-shifted checkout does not silently lose the stamp.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /wrathbench
      # The codex lane inside the container (see x-codex-lane above). The
      # supervisor's own preflight only checks the variable is set; the mount
      # below is what makes it name a logged-in home.
      CODEX_HOME: /home/bun/.codex
    volumes:
      - ..:/wrathbench
      - ../data/wiki:/wrathbench/data/wiki
      - ../data/runs:/wrathbench/data/runs
      - *codex-lane
    networks: [wrathbench]
    # Reaps the orphaned grandchildren an episode can leave behind; bun as pid 1
    # would not.
    init: true
    # `docker compose stop fleet` must be a DRAIN, not a kill: SIGTERM to the
    # supervisor SIGTERMs each lane, run-roster gives its episode 30s of grace,
    # and the supervisor only notices the exits on its next 60s tick. 180s is
    # that floor plus margin — a shorter grace means SIGKILL mid-episode.
    stop_grace_period: 180s
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_started

  # --------------------------------------------------------------- publisher
  # The public dashboard's publisher (infra/publish-dashboard.ts): renders the
  # viewer's own API to JSON, applies the public projection, and PUTs what
  # changed to the R2 bucket. See docs/OPERATIONS.md ("Public dashboard") for
  # the Cloudflare side and docs/PUBLIC-DASHBOARD.md for why the shape is
  # push-based.
  #
  # `oven/bun:1.4.0`, not the runner image: this reads files and makes outbound
  # HTTPS requests, so it needs neither git nor the Claude CLI, and pinning the
  # plain Bun image keeps a runner-image rebuild from recreating the publisher.
  #
  # Only OUTBOUND traffic exists here — nothing listens, no port is published,
  # and no public request ever reaches the lab. That is what lets the public
  # dashboard ship ahead of the inbound-hardening work on the module port.
  #
  # `profiles` keeps a bare `docker compose up -d` from starting a second
  # publisher against the same bucket and state file; naming the service
  # activates it. Use --no-deps for the same reason the fleet does.
  #
  # No depends_on: the publisher reads `data/runs` off the bind mount and calls
  # the viewer's handler in-process, so it is useful (and correct) while the
  # worldserver is down — a deploy window should not stop the public site
  # updating.
  publisher:
    image: oven/bun:1.4.0
    profiles: [publish]
    working_dir: /wrathbench
    command: ["bun", "infra/publish-dashboard.ts", "--loop"]
    environment:
      # The runbook and this block must agree; both are the CLI's contract.
      WRATHBENCH_RUNS_DIR: /wrathbench/data/runs
      WRATHBENCH_FLEET_CONFIG: /wrathbench/infra/fleet.json
      # What was uploaded last, so a pass PUTs only what changed. On the bind
      # mount so a restart re-uploads nothing.
      WRATHBENCH_PUBLISH_STATE: /wrathbench/data/publish/state.json
      # 5 minutes (operator, 2026-08-25). Originally a cost setting: a pass
      # then wrote a near-constant ~24 objects whatever the cadence, because
      # `gen` was one hash over every aggregate and a single live run moving
      # rewrote all of them. At 60s that measured ~1.2M R2 class-A ops/month
      # against a 1M free tier; at 300s it is ~240k. Issue #38 (2026-09-04)
      # gave each aggregate its own hash, so a pass now rewrites only what
      # changed and an idle pass costs 1 PUT. The cadence is left where the
      # operator set it; the headroom to lower it again is a decision, not an
      # automatic consequence.
      WRATHBENCH_PUBLISH_INTERVAL_MS: "300000"
      # Runs projected before the pass flushes them to the bucket, drops the
      # bodies and releases those runs' entry indexes. The pass's memory dial:
      # 1.08 GB peak at 25, 0.78 GB at 8, 0.59 GB at 1 on the 1,016-run tree,
      # all within a few seconds of each other. Eight matches the per-run read
      # pool's width.
      WRATHBENCH_PUBLISH_BATCH: "8"
      # S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET and S3_ENDPOINT are
      # Bun.S3Client's own variable names and are NOT set here: Bun autoloads
      # /wrathbench/.env inside the container, which is where the R2 key pair
      # lives (docs/OPERATIONS.md "Secrets" — `.env`, never argv, never compose).
    volumes:
      # Read-only: the publisher reads the repo and writes nothing but its state
      # file, and the one credential it holds is scoped to one bucket.
      - ..:/wrathbench:ro
      - ../data/runs:/wrathbench/data/runs:ro
      # The only writable path, and the only thing this service owns on disk.
      - ../data/publish:/wrathbench/data/publish
    networks: [wrathbench]
    # An interrupted pass is safe by construction — the manifest is uploaded
    # last, so a torn generation is never pointed at — but 30s lets a pass in
    # flight finish rather than be killed mid-upload.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  db-data:

networks:
  wrathbench:
    driver: bridge
