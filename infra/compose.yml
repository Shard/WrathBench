# WrathBench stack.
#
# Bring up with:  docker compose -f infra/compose.yml up -d
# See infra/README.md for the fresh-machine checklist (the data/ directories
# must exist and be owned by the invoking user before the first `up`).
#
# Posture (docs/DATA-AND-LEGAL.md): no port is published to the host. The realm
# is reachable only from inside the `wrathbench` network. If you must expose
# something for debugging, bind it to 127.0.0.1 explicitly and never commit it.
#
# Config: AzerothCore reads `AC_*` environment variables in preference to the
# values in worldserver.conf / authserver.conf (Config.cpp GetValueDefault
# checks the env var first and only falls back to the parsed file). So the
# generated .conf files under data/etc are the stock dist files and every
# setting we care about is pinned here instead.

name: wrathbench

x-db-info: &db-info
  AC_LOGIN_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_auth"
  AC_WORLD_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_world"
  AC_CHARACTER_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_characters"

x-ac-build: &ac-build
  context: ..
  dockerfile: infra/docker/server.Dockerfile
  args:
    USER_ID: ${WRATHBENCH_UID:-1000}
    GROUP_ID: ${WRATHBENCH_GID:-1000}
    DOCKER_USER: acore

services:
  # ---------------------------------------------------------------- database
  db:
    image: mysql:8.4
    # Version follows AzerothCore's own docker-compose.yml at the pinned commit.
    environment:
      MYSQL_ROOT_PASSWORD: ${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench}
    volumes:
      - db-data:/var/lib/mysql
    networks: [wrathbench]
    restart: unless-stopped
    healthcheck:
      # Verbatim from AzerothCore's compose; the $$ is compose escaping for $.
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  # ------------------------------------------------------------- db bootstrap
  # One shot. Creates acore_auth / acore_characters / acore_world if missing,
  # imports the base dumps, and applies pending updates. Exits 0 when done.
  db-import:
    image: wrathbench/db-import
    build:
      <<: *ac-build
      target: db-import
    environment:
      <<: *db-info
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
    networks: [wrathbench]
    depends_on:
      db:
        condition: service_healthy

  # Realm row + runner account. See infra/bootstrap/bootstrap.ts for why this
  # writes SQL directly rather than driving the worldserver console or SOAP.
  bootstrap:
    image: oven/bun:1.4.0
    working_dir: /wrathbench
    command: ["bun", "run", "infra/bootstrap/bootstrap.ts"]
    environment:
      WRATHBENCH_DB_HOST: db
      WRATHBENCH_DB_PORT: "3306"
      WRATHBENCH_DB_USER: root
      WRATHBENCH_DB_PASSWORD: ${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench}
      WRATHBENCH_AUTH_DB: acore_auth
      WRATHBENCH_REALM_ID: ${WRATHBENCH_REALM_ID:-1}
      WRATHBENCH_REALM_NAME: ${WRATHBENCH_REALM_NAME:-WrathBench}
      # The realm address the auth handshake advertises. The module is
      # in-process and never reads this row, so it stays at host loopback.
      # Never a public address.
      WRATHBENCH_REALM_ADDRESS: 127.0.0.1
      WRATHBENCH_REALM_PORT: "8085"
      # Uppercase: AzerothCore uppercases both before deriving the verifier.
      WRATHBENCH_ACCOUNT_USER: ${WRATHBENCH_ACCOUNT_USER:-RUNNER}
      WRATHBENCH_ACCOUNT_PASSWORD: ${WRATHBENCH_ACCOUNT_PASSWORD:-RUNNER}
    volumes:
      - ..:/wrathbench
    networks: [wrathbench]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ servers
  authserver:
    image: wrathbench/authserver
    build:
      <<: *ac-build
      target: authserver
    environment:
      AC_LOGIN_DATABASE_INFO: "db;3306;root;${WRATHBENCH_DB_ROOT_PASSWORD:-wrathbench};acore_auth"
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_BIND_IP: "0.0.0.0"
      AC_REALM_SERVER_PORT: "3724"
    # Loopback only, for operator inspection.
    # Per docs/DATA-AND-LEGAL.md this must never bind beyond 127.0.0.1.
    ports:
      - "127.0.0.1:3724:3724"
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
    networks: [wrathbench]
    tty: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      # Started, not healthy: authserver resolves the realm address (the
      # `worldserver` service name) at boot and exits if DNS fails, so the
      # worldserver container must exist first. restart:unless-stopped covers
      # the remaining race while worldserver is still coming up.
      worldserver:
        condition: service_started

  worldserver:
    image: wrathbench/worldserver
    build:
      <<: *ac-build
      target: worldserver
    environment:
      <<: *db-info
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_BIND_IP: "0.0.0.0"
      AC_WORLD_SERVER_PORT: "8085"
      AC_REALM_ID: ${WRATHBENCH_REALM_ID:-1}
      # PHASE-0 pins kill XP and quest XP equal at 1.0. Everything else is the
      # stock dist value; do not add tuning here without updating docs/PHASE-0.md.
      AC_RATE_XP_KILL: "1"
      AC_RATE_XP_QUEST: "1"
      # SOAP stays off. The harness has no privileged control path into the
      # world by design (docs/CONTRACTS.md); actions go through the module.
      AC_SOAP_ENABLED: "0"
      # mod-wrathbench control module (module/). Pinned here rather than in the
      # module .conf: the stock docker entrypoint only materialises the main
      # component .conf from its .dist, never module confs, so a fresh boot would
      # otherwise leave the module disabled. AC_* env wins over the file either
      # way (see the config note at the top of this compose). The port is not
      # published to the host; the runner reaches it at worldserver:8086.
      AC_WRATH_BENCH_ENABLE: "1"
      AC_WRATH_BENCH_BIND_ADDRESS: "0.0.0.0"
      AC_WRATH_BENCH_PORT: "8086"
      AC_WRATH_BENCH_AUDIT_DIR: "/azerothcore/env/dist/logs/wrathbench"
      # Server.log with per-boot timestamped backups (appender flag 16), so
      # ERROR/WARN history survives restarts and container recreation on the
      # data/logs volume. Default mode "w" truncated every boot.
      AC_APPENDER_SERVER: "2,5,16,Server.log,w"
      AC_WRATH_BENCH_ACCOUNT: "${WRATHBENCH_ACCOUNT_USER:-RUNNER}"
      # Account allowlist: every surface taking an "account" param serves only
      # these (module refuses others with 403 account_not_permitted).
      # SHAKEOUT2 is the second subscription-lane account (parallel opus+sonnet;
      # one live session per account). It exists in auth already; this line only
      # takes effect when the worldserver container is next recreated, and until
      # then the module answers 403 account_not_permitted for it.
      AC_WRATH_BENCH_ACCOUNTS: "${WRATHBENCH_ACCOUNT_USER:-RUNNER},RUNNER2,RUNNER3,RUNNER4,RUNNER5,RUNNER6,SHAKEOUT,SHAKEOUT2,PROBE"
      AC_WRATH_BENCH_THREADS: "2"
    volumes:
      - ../data/etc:/azerothcore/env/dist/etc
      - ../data/logs:/azerothcore/env/dist/logs
      # AzerothCore server data directory: dbc/ maps/ vmaps/ mmaps/.
      # Supplied by the operator. Read-only, never in git.
      - ../data/client:/azerothcore/env/dist/data:ro
    # Loopback only, for operator inspection.
    # Per docs/DATA-AND-LEGAL.md this must never bind beyond 127.0.0.1.
    # Takes effect when the container is next recreated (deploy window).
    ports:
      - "127.0.0.1:8085:8085"
    networks: [wrathbench]
    stdin_open: true
    tty: true
    restart: unless-stopped
    # No healthcheck: the runtime image has no curl/nc and the module's HTTP
    # port is not defined yet. TODO once module/ lands: probe the module.
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully

  # ------------------------------------------------------------------- runner
  # The agent loop (runner/). Bun plus the Claude Code CLI for the
  # claude-subscription shakeout driver (runner/README.md Drivers).
  runner:
    image: wrathbench/runner
    build:
      context: ..
      dockerfile: infra/docker/runner.Dockerfile
    working_dir: /wrathbench
    command: ["sleep", "infinity"]
    volumes:
      - ..:/wrathbench
      # The repo mount above already carries data/wiki and data/runs. These are
      # named explicitly so the contract survives the repo mount going away.
      - ../data/wiki:/wrathbench/data/wiki
      - ../data/runs:/wrathbench/data/runs
    networks: [wrathbench]
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_started

  # ------------------------------------------------------------------- fleet
  # The fleet supervisor (infra/run-fleet.ts) as a long-lived service: up while
  # the dev machine is up, steered by editing infra/fleet.json, no deadline.
  # See docs/decisions/ADR-0020-fleet-as-a-service.md and docs/OPERATIONS.md.
  #
  # Same image and mounts as `runner` by design: the supervisor's children are
  # run-roster processes whose children are `bun runner/src/run.ts` episodes, so
  # everything the runner needs must be here. WRATHBENCH_IN_CONTAINER switches
  # run-roster off the docker-compose-exec path (there is no docker CLI in this
  # image) and onto direct child processes.
  #
  # `profiles` keeps a bare `docker compose up -d` from starting a SECOND
  # supervisor against the same fleet.json (two lanes on one account is a night
  # of account_in_use). Naming the service activates the profile, so
  #   docker compose -f infra/compose.yml up -d --no-deps fleet
  # still works — and --no-deps is not optional: without it compose may decide a
  # dependency is out of date and recreate the worldserver under live episodes.
  fleet:
    image: wrathbench/runner
    build:
      context: ..
      dockerfile: infra/docker/runner.Dockerfile
    profiles: [fleet]
    working_dir: /wrathbench
    command: ["bun", "infra/run-fleet.ts", "infra/fleet.json"]
    environment:
      WRATHBENCH_IN_CONTAINER: "1"
      # git lives in the image and the repo mount carries .git, so every episode
      # is stamped with a real `git describe` (dirty trees included) rather than
      # a version frozen at `up` time. The repo is uid 1000 and so is `bun`, but
      # be explicit so a uid-shifted checkout does not silently lose the stamp.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /wrathbench
    volumes:
      - ..:/wrathbench
      - ../data/wiki:/wrathbench/data/wiki
      - ../data/runs:/wrathbench/data/runs
    networks: [wrathbench]
    # Reaps the orphaned grandchildren an episode can leave behind; bun as pid 1
    # would not.
    init: true
    # `docker compose stop fleet` must be a DRAIN, not a kill: SIGTERM to the
    # supervisor SIGTERMs each lane, run-roster gives its episode 30s of grace,
    # and the supervisor only notices the exits on its next 60s tick. 180s is
    # that floor plus margin — a shorter grace means SIGKILL mid-episode.
    stop_grace_period: 180s
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_started

volumes:
  db-data:

networks:
  wrathbench:
    driver: bridge
