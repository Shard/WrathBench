# `bun test` from the root runs every workspace's suite in one process, so the
# dashboard's Solid redirect has to be installed here too — bun reads its config
# from the working directory, and dashboard/bunfig.toml is not consulted from
# here. See dashboard/test/preload-solid.ts for what it does and why.
[test]
# `preload-config-store.ts` pins the config store out of the way: the fleet
# config seam prefers a seeded store over any fleet.json a fixture writes, and
# the suite must be green on the machine that runs the fleet as well as from a
# bare clone.
preload = ["./dashboard/test/preload-solid.ts", "./runner/test/preload-config-store.ts"]
